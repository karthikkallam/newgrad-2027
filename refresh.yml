name: Refresh job listings

on:
  schedule:
    - cron: '0 13 * * *'   # 08:00 US Central
    - cron: '0 23 * * *'   # 18:00 US Central
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch listings
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python scripts/fetch_jobs.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_jobs.json
          git diff --staged --quiet || git commit -m "Refresh listings $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
